services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_assistant
    ports:
      - "5432:5432"
    volumes:
      - meeting_assistant_data:/var/lib/postgresql/data

volumes:
  meeting_assistant_data:
